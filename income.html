<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b4ee8">
<title>💰 আমার আয়-ব্যয় হিসাব</title>

<style>
*{box-sizing:border-box}
body{
margin:0;background:#f3f4ff;color:#18223b;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif
}
header{
background:linear-gradient(135deg,#5146e5,#8b5cf6);
color:white;padding:22px 16px;
border-radius:0 0 25px 25px
}
header h1{margin:0;font-size:26px}
header p{margin:6px 0 0;opacity:.9}
nav{
display:flex;gap:8px;overflow-x:auto;padding:12px;
position:sticky;top:0;z-index:10;background:#f3f4ff
}
nav button{
width:auto;white-space:nowrap;margin:0;
background:white;color:#334155;border:0;
padding:11px 16px;border-radius:25px
}
nav button.active{background:#5b4ee8;color:white}
.container{max-width:760px;margin:auto;padding:12px}
.card{
background:white;border-radius:20px;padding:17px;
margin:14px 0;box-shadow:0 4px 18px #00000010
}
h2{margin:0 0 14px;font-size:20px}
input,select,button{
width:100%;padding:13px;margin:5px 0;
border:1px solid #d8dbea;border-radius:12px;
font-size:15px
}
button{border:0;background:#5b4ee8;color:white;font-weight:700}
button.green{background:#16a34a}
button.red{background:#ef4444}
button.gray{background:#e8e7ff;color:#4438b8}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{
background:#f6f5ff;border-radius:15px;padding:14px;
text-align:center
}
.stat b{display:block;font-size:20px;margin-bottom:4px}
.balance{
padding:14px;border-radius:15px;margin:8px 0;
display:flex;justify-content:space-between;gap:10px
}
.income{background:#dcfce7;color:#166534}
.expense{background:#fee2e2;color:#991b1b}
.due{background:#fff7ed;color:#9a3412}
.receive{background:#e0f2fe;color:#075985}
.hidden{display:none}
.small{font-size:12px;color:#64748b}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 5px;border-bottom:1px solid #eee;text-align:left}
th{background:#f5f4ff}
.actionRow{display:flex;gap:5px}
.actionRow button{width:auto;padding:8px 10px}
@media(max-width:500px){
.grid,.stats{grid-template-columns:1fr}
}
@media print{
nav,.no-print,header p{display:none!important}
body{background:white}
.card{box-shadow:none;border:1px solid #ddd}
}
</style>
</head>

<body>

<header>
<h1>💰 আমার আয়-ব্যয় হিসাব</h1>
<p>Euro (€) • মাসভিত্তিক • অটো হিসাব</p>
</header>

<nav>
<button class="active" onclick="tab('home',this)">📊 Summary</button>
<button onclick="tab('income',this)">💵 আয়</button>
<button onclick="tab('expense',this)">💸 খরচ</button>
<button onclick="tab('people',this)">👥 পাওনা/দেনা</button>
<button onclick="tab('report',this)">📄 Report</button>
</nav>

<div class="container">

<!-- SUMMARY -->
<section id="home">

<div class="card">
<h2>📅 মাস নির্বাচন</h2>
<input type="month" id="month" onchange="render()">
</div>

<div class="card">
<h2>📊 এই মাসের হিসাব</h2>
<div id="summary"></div>
</div>

<div class="card">
<h2>👥 পাওনা ও দেনা</h2>
<div id="peopleSummary"></div>
</div>

</section>

<!-- INCOME -->
<section id="income" class="hidden">

<div class="card">
<h2>💵 আয় যোগ করুন</h2>

<input type="date" id="incomeDate">

<select id="incomeType">
<option value="job">💵 চাকরি থেকে আয়</option>
<option value="car">🚗 গাড়ি চালিয়ে আয়</option>
<option value="other">💰 অন্যান্য আয়</option>
</select>

<input id="incomeNote" placeholder="বিবরণ">
<input type="number" id="incomeAmount" step="0.01" placeholder="কত €">

<button onclick="addIncome()">＋ আয় যোগ করুন</button>
</div>

<div class="card">
<h2>📜 আয়ের তালিকা</h2>
<div id="incomeList"></div>
</div>

</section>

<!-- EXPENSE -->
<section id="expense" class="hidden">

<div class="card">
  <h2>💸 খরচ যোগ করুন</h2>

<input type="date" id="expenseDate">

<select id="expenseType">
<option value="car">🚗 গাড়ি — তেল</option>
<option value="repair">🔧 গাড়ি — মেরামত</option>
<option value="insurance">🛡️ গাড়ি — Insurance</option>
<option value="tax">📄 গাড়ি — Tax</option>
<option value="carOther">🚗 গাড়ি — অন্যান্য</option>
<option value="home">🏠 বাসা / ব্যক্তিগত</option>
<option value="food">🍔 খাবার / দৈনন্দিন</option>
<option value="other">💸 অন্যান্য</option>
</select>

<input id="expenseNote" placeholder="বিবরণ">
<input type="number" id="expenseAmount" step="0.01" placeholder="কত €">

<button onclick="addExpense()">＋ খরচ যোগ করুন</button>
</div>

<div class="card">
<h2>📜 খরচের তালিকা</h2>
<div id="expenseList"></div>
</div>

</section>

<!-- PEOPLE -->
<section id="people" class="hidden">

<div class="card">
<h2>💰 আমার কাছে কে টাকা পাবে</h2>

<input id="oweName" placeholder="নাম">
<input type="number" id="oweAmount" step="0.01" placeholder="কত €">
<input type="date" id="oweDate">

<select id="oweStatus">
<option value="open">এখনও ফেরত দেওয়া হয়নি</option>
<option value="paid">ফেরত দেওয়া হয়েছে</option>
</select>

<input id="oweNote" placeholder="বিবরণ">

<button onclick="addOwe()">＋ যোগ করুন</button>
</div>

<div class="card">
<h2>💸 আমি কার কাছে টাকা পাব</h2>

<input id="receivableName" placeholder="নাম">
<input type="number" id="receivableAmount" step="0.01" placeholder="কত €">
<input type="date" id="receivableDate">

<select id="receivableStatus">
<option value="open">এখনও টাকা পাইনি</option>
<option value="paid">টাকা পেয়েছি</option>
</select>

<input id="receivableNote" placeholder="বিবরণ">

<button onclick="addReceivable()">＋ যোগ করুন</button>
</div>

<div class="card">
<h2>📜 পাওনা / দেনার তালিকা</h2>
<div id="peopleList"></div>
</div>

</section>

<!-- REPORT -->
<section id="report" class="hidden">

<div class="card">
<h2>📄 Monthly Report</h2>
<div id="reportContent"></div>

<button class="green no-print" onclick="window.print()">
📄 PDF / Print
</button>
</div>

<div class="card no-print">
<h2>💾 Backup</h2>

<button onclick="backup()">💾 Backup Save</button>

<button class="gray"
onclick="document.getElementById('restore').click()">
📥 Restore Backup
</button>

<input type="file" id="restore" accept=".json"
style="display:none" onchange="restoreBackup(event)">

<button class="red" onclick="clearAll()">
🗑️ সব হিসাব মুছুন
</button>
</div>

</section>

</div>

<script>

const KEY="PERSONAL_INCOME_EXPENSE_V1";

let db=JSON.parse(localStorage.getItem(KEY)||"null");

if(!db){
db={
incomes:[],
expenses:[],
owe:[],
receivable:[]
};
}

function save(){
localStorage.setItem(KEY,JSON.stringify(db));
render();
}

function money(n){
return "€"+Number(n||0).toFixed(2);
}

function today(){
return new Date().toISOString().slice(0,10);
}

function currentMonth(){
return today().slice(0,7);
}

function esc(x){
return String(x||"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");
}

function tab(id,button){

document.querySelectorAll("section").forEach(s=>{
s.classList.add("hidden");
});

document.getElementById(id).classList.remove("hidden");

document.querySelectorAll("nav button").forEach(b=>{
b.classList.remove("active");
});

button.classList.add("active");

}

function month(){
return document.getElementById("month").value||currentMonth();
}

function inMonth(date){
return String(date||"").slice(0,7)===month();
}

/* INCOME */

function addIncome(){

let amount=Number(document.getElementById("incomeAmount").value);

if(amount<=0)return alert("টাকার পরিমাণ দিন");

db.incomes.push({
id:Date.now(),
date:document.getElementById("incomeDate").value||today(),
type:document.getElementById("incomeType").value,
note:document.getElementById("incomeNote").value,
  amount:amount
});

document.getElementById("incomeAmount").value="";
document.getElementById("incomeNote").value="";

save();

}

/* EXPENSE */

function addExpense(){

let amount=Number(document.getElementById("expenseAmount").value);

if(amount<=0)return alert("টাকার পরিমাণ দিন");

db.expenses.push({
id:Date.now(),
date:document.getElementById("expenseDate").value||today(),
type:document.getElementById("expenseType").value,
note:document.getElementById("expenseNote").value,
amount:amount
});

document.getElementById("expenseAmount").value="";
document.getElementById("expenseNote").value="";

save();

}

/* OWE */

function addOwe(){

let name=document.getElementById("oweName").value.trim();
let amount=Number(document.getElementById("oweAmount").value);

if(!name||amount<=0)return alert("নাম ও টাকা দিন");

db.owe.push({
id:Date.now(),
name:name,
amount:amount,
date:document.getElementById("oweDate").value||today(),
status:document.getElementById("oweStatus").value,
note:document.getElementById("oweNote").value
});

document.getElementById("oweName").value="";
document.getElementById("oweAmount").value="";
document.getElementById("oweNote").value="";

save();

}

/* RECEIVABLE */

function addReceivable(){

let name=document.getElementById("receivableName").value.trim();
let amount=Number(document.getElementById("receivableAmount").value);

if(!name||amount<=0)return alert("নাম ও টাকা দিন");

db.receivable.push({
id:Date.now(),
name:name,
amount:amount,
date:document.getElementById("receivableDate").value||today(),
status:document.getElementById("receivableStatus").value,
note:document.getElementById("receivableNote").value
});

document.getElementById("receivableName").value="";
document.getElementById("receivableAmount").value="";
document.getElementById("receivableNote").value="";

save();

}

/* DELETE */

function del(type,id){

if(!confirm("এই হিসাব মুছে ফেলবেন?"))return;

db[type]=db[type].filter(x=>x.id!==id);

save();

}

/* STATUS */

function status(type,id){

let x=db[type].find(x=>x.id===id);

if(!x)return;

x.status=x.status==="open"?"paid":"open";

save();

}

/* SUMMARY */

function calculate(){

let income=0;
let expense=0;

db.incomes.forEach(x=>{
if(inMonth(x.date))income+=Number(x.amount);
});

db.expenses.forEach(x=>{
if(inMonth(x.date))expense+=Number(x.amount);
});

let owing=0;
let receiving=0;

db.owe.forEach(x=>{
if(x.status==="open")owing+=Number(x.amount);
});

db.receivable.forEach(x=>{
if(x.status==="open")receiving+=Number(x.amount);
});

return{
income:income,
expense:expense,
balance:income-expense,
owing:owing,
receiving:receiving,
cashAfterDebt:income-expense-owing+receiving
};

}

/* RENDER */

function render(){

let m=document.getElementById("month");

if(!m.value)m.value=currentMonth();

let c=calculate();

document.getElementById("summary").innerHTML=`

<div class="stats">

<div class="stat">
<b>${money(c.income)}</b>
💵 মোট আয়
</div>

<div class="stat">
<b>${money(c.expense)}</b>
💸 মোট খরচ
</div>

<div class="stat">
<b>${money(c.balance)}</b>
💰 আয় - খরচ
</div>

<div class="stat">
<b>${money(c.cashAfterDebt)}</b>
💳 হিসাবের পর ব্যালেন্স
</div>

</div>

<br>

<table>

<tr>
<th>বিষয়</th>
<th>পরিমাণ</th>
</tr>

<tr>
<td>💵 মোট আয়</td>
<td>${money(c.income)}</td>
</tr>

<tr>
<td>💸 মোট খরচ</td>
<td>${money(c.expense)}</td>
</tr>

<tr>
<td>💰 আমার কাছে পাওনা (দেনা)</td>
<td>${money(c.owing)}</td>
</tr>

<tr>
<td>💸 আমি পাব</td>
<td>${money(c.receiving)}</td>
</tr>

</table>

`;

document.getElementById("peopleSummary").innerHTML=`

<div class="balance due">
<div>
<b>💰 অন্যরা তোমার কাছে পাবে</b>
</div>
<strong>${money(c.owing)}</strong>
</div>

<div class="balance receive">
<div>
<b>💸 তুমি অন্যদের কাছ থেকে পাবে</b>
</div>
<strong>${money(c.receiving)}</strong>
</div>

`;

renderIncome();
  renderExpense();
renderPeople();
renderReport();

}

/* INCOME LIST */

function renderIncome(){

let arr=db.incomes.filter(x=>inMonth(x.date));

document.getElementById("incomeList").innerHTML=

arr.length?

`<table>

<tr>
<th>তারিখ</th>
<th>ধরন</th>
<th>বিবরণ</th>
<th>টাকা</th>
<th></th>
</tr>

${arr.map(x=>`

<tr>

<td>${x.date}</td>

<td>
${x.type==="job"?"💵 চাকরি":
x.type==="car"?"🚗 গাড়ি":"💰 অন্যান্য"}
</td>

<td>${esc(x.note)}</td>

<td><b>${money(x.amount)}</b></td>

<td>
<button class="red"
style="width:auto;padding:7px"
onclick="del('incomes',${x.id})">×</button>
</td>

</tr>

`).join("")}

</table>`

:"এই মাসে কোনো আয় নেই।";

}

/* EXPENSE LIST */

function renderExpense(){

let arr=db.expenses.filter(x=>inMonth(x.date));

document.getElementById("expenseList").innerHTML=

arr.length?

`<table>

<tr>
<th>তারিখ</th>
<th>ধরন</th>
<th>বিবরণ</th>
<th>টাকা</th>
<th></th>
</tr>

${arr.map(x=>`

<tr>

<td>${x.date}</td>

<td>${expenseName(x.type)}</td>

<td>${esc(x.note)}</td>

<td><b>${money(x.amount)}</b></td>

<td>
<button class="red"
style="width:auto;padding:7px"
onclick="del('expenses',${x.id})">×</button>
</td>

</tr>

`).join("")}

</table>`

:"এই মাসে কোনো খরচ নেই।";

}

function expenseName(t){

let a={
car:"🚗 তেল",
repair:"🔧 মেরামত",
insurance:"🛡️ Insurance",
tax:"📄 Tax",
carOther:"🚗 গাড়ি অন্যান্য",
home:"🏠 বাসা / ব্যক্তিগত",
food:"🍔 খাবার / দৈনন্দিন",
other:"💸 অন্যান্য"
};

return a[t]||t;

}

/* PEOPLE */

let a=db.owe;
let b=db.receivable;

let html="";

if(a.length){

a.forEach(x=>{

html+=`

<div class="balance due">

<div>

<b>${esc(x.name)}</b>

${money(x.amount)} • ${x.date}

onclick="status('owe',${x.id})">

html+=`

<div class="balance receive">

<div>

<b>${esc(x.name)}</b>

<div class="small">

${money(x.amount)} • ${x.date}

<br>

${x.status==="open"?"⏳ এখনো পাওনি":"✅ টাকা পেয়েছো"}

document.getElementById("peopleList").innerHTML=

let c=calculate();

document.getElementById("reportContent").innerHTML=`

<h3>📊 ${month()} Report</h3>

<table>

<tr>
<td>💵 মোট আয়</td>
<td><b>${money(c.income)}</b></td>
</tr>

<tr>
<td>💸 মোট খরচ</td>
<td><b>${money(c.expense)}</b></td>
</tr>

<tr>
<td>💰 আয় - খরচ</td>
<td><b>${money(c.balance)}</b></td>
</tr>

<tr>
<td>💰 অন্যরা তোমার কাছে পাবে</td>
<td><b>${money(c.owing)}</b></td>
</tr>

<tr>
<td>💸 তুমি অন্যদের কাছ থেকে পাবে</td>
<td><b>${money(c.receiving)}</b></td>
</tr>

<tr>
<td>💳 হিসাবের পর ব্যালেন্স</td>
<td><b>${money(c.cashAfterDebt)}</b></td>
</tr>

</table>

<h3>💵 আয়ের বিস্তারিত</h3>

${db.incomes.filter(x=>inMonth(x.date)).map(x=>`

<p>
${x.date} — ${x.type==="job"?"চাকরি":x.type==="car"?"গাড়ি চালিয়ে":"অন্যান্য"}
— ${esc(x.note)}
— <b>${money(x.amount)}</b>
</p>

${db.expenses.filter(x=>inMonth(x.date)).map(x=>`

<p>
${x.date} — ${expenseName(x.type)}
— ${esc(x.note)}
— <b>${money(x.amount)}</b>
</p>

`).join("")||"<p>কোনো খরচ নেই।</p>"}

}

/* BACKUP */

function backup(){

let blob=new Blob(
  [JSON.stringify(db,null,2)],
{type:"application/json"}
);

let a=document.createElement("a");

a.href=URL.createObjectURL(blob);
a.download="income-expense-backup.json";
a.click();

}

function restoreBackup(event){

let file=event.target.files[0];

if(!file)return;

let reader=new FileReader();

reader.onload=function(){

try{

let x=JSON.parse(reader.result);

if(!x.incomes||!x.expenses||!x.owe||!x.receivable)
throw Error();

db=x;

save();

alert("Backup Restore হয়েছে ✅");

}catch(e){

alert("Backup ফাইল সঠিক নয়।");

}

};

reader.readAsText(file);

}

/* CLEAR */

function clearAll(){

if(!confirm("সব হিসাব মুছে ফেলবেন?"))return;
